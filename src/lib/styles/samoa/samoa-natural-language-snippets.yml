emblems:
  none: ""
  crown: "Add a crown above the lettering where the pendant bail normally sits. Match the style, diamond setting, edging, and proportions shown in the second reference image. The crown should be around 15-30% of the size of the main lettering and should feel naturally integrated into the pendant. Attach it using two short, sturdy support bridges positioned close together on the centerline, not thin gemstone prongs."
