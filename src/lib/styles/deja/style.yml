  - heart
  - spade
  - butterfly
  - moneybag
fontReference:
  family: Campana Script
  file: public/style-fonts/deja/CampanaScript.otf
  transform: none
  renderOptions:
    backgroundColor: "#ffffff"
    fillColor: "#050505"
